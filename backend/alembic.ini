# Alembic configuration.
#
# The database URL is deliberately absent: it comes from DATABASE_URL via
# migrations/env.py, so credentials are never committed and the same migration
# runs against dev, test, and production without editing a file.

[alembic]
# %(here)s is the directory containing this file, so alembic works no matter
# what the current working directory is.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
